<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            font-family: 'Inter', sans-serif; 
            text-align: center; 
            color: #1e293b; 
        }
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            border-top: 6px solid #3b82f6;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        h1 { 
            font-size: 32px; 
            margin: 0 0 16px 0; 
            color: #1e3a8a; 
            font-weight: 700;
        }
        p { 
            font-size: 18px; 
            color: #475569; 
            line-height: 1.6; 
            margin: 0 0 24px 0;
        }
        .badge {
            display: inline-block;
            background: #f1f5f9;
            color: #64748b;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Website Under Maintenance</h1>
        <p>We are currently upgrading our systems. The backend and automation infrastructure are currently being built to serve you better.</p>
        <div class="badge">Check back soon</div>
    </div>
</body>
</html>
