<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GST Automation</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/config.js?v=5"></script>
    <style>
        body { background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 400px; }
        h1 { margin-top: 0; font-size: 24px; color: #1e293b; text-align: center; margin-bottom: 8px; }
        p.subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #475569; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; font-size: 14px; background: #f8fafc; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #3b82f6; background: white; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 8px; transition: background 0.2s; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2); }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .error { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your new password below</p>
        <form id="resetForm">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" required>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
            </div>
            <button type="submit" id="submitBtn">Update Password</button>
            <div id="errorMsg" class="error"></div>
        </form>
    </div>

    <script>
        const supabaseUrl = (window.ENV && window.ENV.SUPABASE_URL) ? window.ENV.SUPABASE_URL : 'https://mgxsxpbrzmcmzlzgzfde.supabase.co';
        const supabaseKey = (window.ENV && window.ENV.SUPABASE_KEY) ? window.ENV.SUPABASE_KEY : 'sb_publishable_159AAeN0gJjlQK7IgozhRQ_5yWUUKmm';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            
            if (newPassword !== confirmPassword) {
                errorMsg.innerText = 'Passwords do not match!';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Updating...';
            errorMsg.innerText = '';

            try {
                // Update the user's auth password
                const { data, error } = await supabaseClient.auth.updateUser({ password: newPassword });
                if (error) throw error;
                
                // Also update the password in our custom user_credentials table so admin can see it
                if (data.user && data.user.email) {
                    await supabaseClient.from('user_credentials').update({ password: newPassword }).eq('email', data.user.email);
                }

                errorMsg.style.color = '#16a34a';
                errorMsg.innerText = 'Password updated successfully! Redirecting to login...';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);

            } catch (err) {
                errorMsg.style.color = '#dc2626';
                errorMsg.innerText = err.message;
                submitBtn.disabled = false;
                submitBtn.innerText = 'Update Password';
            }
        });
    </script>
</body>
</html>
